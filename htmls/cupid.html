<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cursor Cat + SVG Sprites Trail (Transparent)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { height: 100vh; margin: 0; font-family: system-ui, sans-serif; }

    /* Particle canvas never blocks clicks and stays behind the cat */
    #trail {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2147483646; /* behind cat */
    }

    /* Cat is above trail */
    #cursor-cat {
      color: #111;
      position: relative;
      z-index: 2147483647;
    }

    /* ===== Settings UI ===== */
    #cfg-toggle {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 2147483647;
      border: 0;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 16px;
      cursor: pointer;
      background: rgba(20, 20, 20, 0.88);
      color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }

    #cfg-panel {
      position: fixed;
      right: 14px;
      bottom: 60px;
      width: min(360px, calc(100vw - 28px));
      max-height: min(72vh, 680px);
      overflow: auto;
      z-index: 2147483647;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.22);
      padding: 12px 12px 10px;
      display: none;
    }

    #cfg-panel.open { display: block; }

    #cfg-panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    #cfg-panel h3 span {
      opacity: 0.75;
      font-weight: 600;
      font-size: 12px;
    }

    .cfg-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .cfg-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .cfg-row label {
      font-size: 12px;
      font-weight: 650;
      color: #111;
      line-height: 1.2;
    }

    .cfg-row label small {
      display: block;
      opacity: 0.65;
      font-weight: 600;
      margin-top: 2px;
    }

    .cfg-controls {
      display: grid;
      gap: 6px;
      justify-items: end;
    }

    .cfg-controls input[type="number"]{
      width: 110px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.95);
      font-size: 12px;
      outline: none;
    }

    .cfg-controls input[type="range"]{
      width: 140px;
    }

    .cfg-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .cfg-actions button {
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .cfg-actions button.primary {
      background: rgba(20,20,20,0.9);
      color: #fff;
      border-color: rgba(0,0,0,0.25);
    }

    .cfg-actions input[type="file"]{
      display: none;
    }

    .cfg-note {
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <div id="cursor-cat"></div>

  <!-- UI -->
  <button id="cfg-toggle" type="button" aria-label="Toggle settings">⚙️</button>
  <div id="cfg-panel" role="dialog" aria-label="Cursor Cat Settings">
    <h3>
      Cursor Cat Settings
      <span id="cfg-status">live</span>
    </h3>

    <div class="cfg-grid" id="cfg-grid"></div>

    <div class="cfg-actions">
      <button class="primary" id="cfg-export" type="button">Export JSON</button>
      <button id="cfg-import-btn" type="button">Import JSON</button>
      <input id="cfg-import" type="file" accept="application/json" />
      <button id="cfg-reset" type="button">Reset</button>
    </div>

    <div class="cfg-note">
      Tip: Export a JSON, tweak values, then Import it back. Changes apply instantly.
    </div>

    mount.appendChild(wrap);

    const svg = wrap.querySelector("svg");
    svg.setAttribute("width", CFG.size);
    svg.setAttribute("height", CFG.size);
    svg.style.position = "absolute";
    svg.style.transformOrigin = "50% 50%";
    svg.style.willChange = "transform";

    /* ========= STATE ========= */
    let targetX = innerWidth / 2, targetY = innerHeight / 2;
    let x = targetX, y = targetY;
    let vx = 0, vy = 0;
    let angle = 0, lastAngle = 0, angleVel = 0;

    /* ========= INPUT ========= */
    const onMove = (e) => { targetX = e.clientX; targetY = e.clientY; };
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("pointermove", onMove, { passive: true });

    /* ========= UTILS ========= */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerpAngle = (a, b, t) => {
      let d = ((b - a + 540) % 360) - 180;
      return a + d * t;
    };
    const rand = (a, b) => a + Math.random() * (b - a);
    const randSign = () => (Math.random() < 0.5 ? -1 : 1);

    /* ========= SPRITE: SVG -> Image ========= */
    const SPRITES = [
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <path fill="#ffd86b" d="M32 2l6 20 20 6-20 6-6 20-6-20-20-6 20-6z"/>
      </svg>`,
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <path fill="#ff5a8a" d="M32 56S6 41 6 22c0-8 6-14 14-14 5 0 9 2 12 6 3-4 7-6 12-6 8 0 14 6 14 14 0 19-26 34-26 34z"/>
      </svg>`,
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <path fill="#7bdcff" d="M20 34c-5 0-9-5-9-10s4-9 9-9 9 4 9 9-4 10-9 10zm24 0c-5 0-9-5-9-10s4-9 9-9 9 4 9 9-4 10-9 10z"/>
        <path fill="#7bdcff" d="M32 58c-10 0-18-6-18-14 0-7 6-13 18-13s18 6 18 13c0 8-8 14-18 14z"/>
        <path fill="#7bdcff" d="M12 30c-4 0-7-4-7-8s3-7 7-7 7 3 7 7-3 8-7 8zm40 0c-4 0-7-4-7-8s3-7 7-7 7 3 7 7-3 8-7 8z"/>
      </svg>`
    ];

    function svgToImage(svgText) {
      const blob = new Blob([svgText], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.src = url;
      img.onload = () => URL.revokeObjectURL(url);
      return img;
    }
    const spriteImages = SPRITES.map(svgToImage);

    /* ========= PARTICLES ========= */
    const particles = [];
    let spawnCarry = 0;

    function spawnParticle(px, py) {
      const img = spriteImages[(Math.random() * spriteImages.length) | 0];

      const size0 = rand(CFG.minSize, CFG.maxSize);
      const life = rand(CFG.lifeMin, CFG.lifeMax);

      // emit behind cat (opposite of velocity direction)
      const vlen = Math.hypot(vx, vy) || 1;
      const backX = -vx / vlen;
      const backY = -vy / vlen;

      // a little cone spread behind
      const spread = rand(-0.9, 0.9);
      const ox = backX * rand(6, 18) + spread * backY * rand(2, 10);
      const oy = backY * rand(6, 18) - spread * backX * rand(2, 10);

      const drift = rand(CFG.driftMin, CFG.driftMax);
      const dir = rand(0, Math.PI * 2);
      const dvx = Math.cos(dir) * drift;
      const dvy = Math.sin(dir) * drift;

      particles.push({
        img,
        x: px + ox,
        y: py + oy,
        vx: dvx + vx * CFG.inheritVelocity,
        vy: dvy + vy * CFG.inheritVelocity,
        rot: rand(0, 360),
        spin: rand(0, CFG.randomSpin) * randSign(),
        size0,
        life,
        age: 0
      });
    }

    function updateAndDrawParticles(dt) {
      // Clear each frame but keep it transparent
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        if (p.age >= p.life) {
          particles.splice(i, 1);
          continue;
        }

        // physics
        p.vy += CFG.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.spin * dt;

        // normalized life (0..1)
        const t = p.age / p.life;

        // fade + shrink (nice easing)
        const fade = Math.pow(1 - t, CFG.fadePow);
        const alpha = CFG.alpha * fade;

        const scale = (1 - t) * (1 - CFG.shrinkTo) + CFG.shrinkTo;
        const size = p.size0 * scale;

        // draw
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.drawImage(p.img, -size / 2, -size / 2, size, size);
        ctx.restore();
      }
    }

    /* ========= LOOP ========= */
    let lastT = performance.now();

    function tick(now) {
      const dt = Math.min(0.033, (now - lastT) / 1000); // clamp dt
      lastT = now;

      const dx = targetX - x;
      const dy = targetY - y;

      vx += dx * CFG.followStrength;
      vy += dy * CFG.followStrength;

      vx *= CFG.damping;
      vy *= CFG.damping;

      const speed = Math.hypot(vx, vy);
      if (speed > CFG.maxSpeed) {
        const s = CFG.maxSpeed / speed;
        vx *= s; vy *= s;
      }

      x += vx; y += vy;

      if (speed > 0.3) {
        const desired = Math.atan2(vy, vx) * 180 / Math.PI;
        angle = lerpAngle(angle, desired, CFG.rotateFollow);
      }

      const turn = (((angle - lastAngle + 540) % 360) - 180);
      lastAngle = angle;
      angleVel = angleVel * 0.85 + turn * 0.6;
      const bank = clamp(-angleVel * 0.9, -CFG.bankAmount, CFG.bankAmount);

      // spawn rate based on speed
      const speedNorm = clamp(speed / CFG.maxSpeed, 0, 1);
      const rate = CFG.spawnRateIdle + (CFG.spawnRateMoving - CFG.spawnRateIdle) * speedNorm; // sprites/sec

      spawnCarry += rate * dt;
      while (spawnCarry >= 1) {
        spawnCarry -= 1;
        spawnParticle(x, y);
      }

      updateAndDrawParticles(dt);

      const facingLeft = vx < 0;
      const flipY = facingLeft ? 1 : 1;

      const half = CFG.size / 2;
      svg.style.transform =
        `translate(${x - half}px, ${y - half}px)
         scale(1, ${flipY})
         rotate(${angle + bank + CFG.angleOffset}deg)`;

      requestAnimationFrame(tick);
    }
    requestAnimationFrame((t) => { lastT = t; tick(t); });

    // tiny API (still works)
    window.CursorCat = {
      setColor: (c) => mount.style.color = c,
      setSize: (s) => { CFG.size = s; svg.setAttribute("width", s); svg.setAttribute("height", s); },
      setSpriteSize: (min, max) => { CFG.minSize = min; CFG.maxSize = max; },
      setSpawnRate: (idle, moving) => { CFG.spawnRateIdle = idle; CFG.spawnRateMoving = moving; },
      setLife: (min, max) => { CFG.lifeMin = min; CFG.lifeMax = max; }
    };

    /* ========= SETTINGS PANEL ========= */
    const toggleBtn = document.getElementById("cfg-toggle");
    const panel = document.getElementById("cfg-panel");
    const grid = document.getElementById("cfg-grid");
    const exportBtn = document.getElementById("cfg-export");
    const importBtn = document.getElementById("cfg-import-btn");
    const importInput = document.getElementById("cfg-import");
    const resetBtn = document.getElementById("cfg-reset");

    // Describe how each CFG key should be edited
    const FIELDS = [
      { key: "size",            label: "Size",               help: "px",        type: "range+number", min: 16,  max: 256, step: 1,   onChange: () => { svg.setAttribute("width", CFG.size); svg.setAttribute("height", CFG.size); } },
      { key: "followStrength",  label: "Follow strength",        help: "accel factor", type: "range+number", min: 0,   max: 0.4, step: 0.01 },
      { key: "damping",         label: "Damping",                help: "0..1",      type: "range+number", min: 0.5, max: 0.98, step: 0.01 },
      { key: "maxSpeed",        label: "Max speed",              help: "px/frame-ish", type: "range+number", min: 1,   max: 40,  step: 0.5 },
      { key: "rotateFollow",    label: "Rotate follow",          help: "0..1",      type: "range+number", min: 0,   max: 0.4, step: 0.01 },
      { key: "bankAmount",      label: "Bank amount",            help: "deg",       type: "range+number", min: 0,   max: 60,  step: 1 },
      { key: "angleOffset",     label: "Angle offset",           help: "deg",       type: "number",       min: -360, max: 360, step: 1 },

      { key: "spawnRateIdle",   label: "Spawn rate (idle)",      help: "sprites/sec", type: "range+number", min: 0,   max: 60,  step: 1 },
      { key: "spawnRateMoving", label: "Spawn rate (moving)",    help: "sprites/sec", type: "range+number", min: 0,   max: 120, step: 1 },

      { key: "minSize",         label: "Sprite min size",        help: "px",        type: "range+number", min: 2,   max: 200, step: 1 },
      { key: "maxSize",         label: "Sprite max size",        help: "px",        type: "range+number", min: 2,   max: 240, step: 1 },

      { key: "lifeMin",         label: "Life min",               help: "sec",       type: "range+number", min: 0.05, max: 10,  step: 0.05 },
      { key: "lifeMax",         label: "Life max",               help: "sec",       type: "range+number", min: 0.05, max: 12,  step: 0.05 },

      { key: "shrinkTo",        label: "Shrink to",              help: "end scale", type: "range+number", min: 0,   max: 1,   step: 0.01 },

      { key: "driftMin",        label: "Drift min",              help: "px/sec",    type: "range+number", min: 0,   max: 300, step: 1 },
      { key: "driftMax",        label: "Drift max",              help: "px/sec",    type: "range+number", min: 0,   max: 500, step: 1 },

      { key: "inheritVelocity", label: "Inherit velocity",       help: "0..1",      type: "range+number", min: 0,   max: 1,   step: 0.01 },

      { key: "randomSpin",      label: "Random spin",            help: "deg/sec",   type: "range+number", min: 0,   max: 720, step: 5 },

      { key: "gravity",         label: "Gravity",                help: "px/sec²",   type: "range+number", min: -2000, max: 4000, step: 10 },

      { key: "alpha",           label: "Start alpha",            help: "0..1",      type: "range+number", min: 0,   max: 1,   step: 0.01 },
      { key: "fadePow",         label: "Fade power",             help: "easing",    type: "range+number", min: 0.2, max: 4,   step: 0.05 },
    ];

    function coerceNumber(value, step) {
      const n = Number(value);
      if (!Number.isFinite(n)) return null;
      // Keep precision reasonable for fractional steps
      const decimals = (String(step).split(".")[1] || "").length;
      if (decimals > 0) return Number(n.toFixed(decimals));
      return n;
    }

    function applyFieldConstraints() {
      // Some sanity coupling:
      if (CFG.maxSize < CFG.minSize) CFG.maxSize = CFG.minSize;
      if (CFG.lifeMax < CFG.lifeMin) CFG.lifeMax = CFG.lifeMin;
      if (CFG.driftMax < CFG.driftMin) CFG.driftMax = CFG.driftMin;
      if (CFG.spawnRateMoving < CFG.spawnRateIdle) CFG.spawnRateMoving = CFG.spawnRateIdle;
    }

    function setCFGValue(key, value) {
      CFG[key] = value;
      applyFieldConstraints();

      // field-specific onChange hooks
      const field = FIELDS.find(f => f.key === key);
      if (field && typeof field.onChange === "function") field.onChange();

      // keep UI in sync when constraints adjust related values
      syncUIFromCFG();
    }

    const uiByKey = new Map();

    function makeRow(field) {
      const row = document.createElement("div");
      row.className = "cfg-row";

      const label = document.createElement("label");
      label.textContent = field.label;
      if (field.help) {
        const small = document.createElement("small");
        small.textContent = field.help;
        label.appendChild(small);
      }

      const controls = document.createElement("div");
      controls.className = "cfg-controls";

      let range = null;
      let number = null;

      if (field.type === "range+number") {
        range = document.createElement("input");
        range.type = "range";
        range.min = field.min;
        range.max = field.max;
        range.step = field.step;

        number = document.createElement("input");
        number.type = "number";
        number.min = field.min;
        number.max = field.max;
        number.step = field.step;

        const onInput = (raw) => {
          const n = coerceNumber(raw, field.step);
          if (n === null) return;
          setCFGValue(field.key, clamp(n, Number(field.min), Number(field.max)));
        };

        range.addEventListener("input", () => onInput(range.value), { passive: true });
        number.addEventListener("input", () => onInput(number.value), { passive: true });

        controls.appendChild(range);
        controls.appendChild(number);
      } else {
        number = document.createElement("input");
        number.type = "number";
        number.min = field.min;
        number.max = field.max;
        number.step = field.step;

        number.addEventListener("input", () => {
          const n = coerceNumber(number.value, field.step);
          if (n === null) return;
          setCFGValue(field.key, clamp(n, Number(field.min), Number(field.max)));
        }, { passive: true });

        controls.appendChild(number);
      }

      row.appendChild(label);
      row.appendChild(controls);

      uiByKey.set(field.key, { range, number, field });
      return row;
    }

    function buildUI() {
      grid.innerHTML = "";
      for (const field of FIELDS) grid.appendChild(makeRow(field));
      syncUIFromCFG();
    }

    function syncUIFromCFG() {
      for (const [key, ui] of uiByKey.entries()) {
        if (!ui) continue;
        const val = CFG[key];
        if (ui.range) ui.range.value = String(val);
        if (ui.number) ui.number.value = String(val);
      }
    }

    function downloadJSON(filename, obj) {
      const json = JSON.stringify(obj, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    }

    function safeApplyConfig(partial) {
      if (!partial || typeof partial !== "object") return;

      for (const field of FIELDS) {
        const key = field.key;
        if (!(key in partial)) continue;
        const n = Number(partial[key]);
        if (!Number.isFinite(n)) continue;
        // clamp to field min/max
        const clamped = clamp(n, Number(field.min), Number(field.max));
        CFG[key] = clamped;
      }
      applyFieldConstraints();
      // apply any hooks (size needs immediate SVG update)
      const sizeField = FIELDS.find(f => f.key === "size");
      if (sizeField && typeof sizeField.onChange === "function") sizeField.onChange();
      syncUIFromCFG();
    }

    // Toggle panel
    toggleBtn.addEventListener("click", () => {
      panel.classList.toggle("open");
    });

    // Export
    exportBtn.addEventListener("click", () => {
      downloadJSON("cursor-cat-config.json", CFG);
    });

    // Import (button triggers hidden input)
    importBtn.addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", async () => {
      const file = importInput.files && importInput.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        safeApplyConfig(parsed);
      } catch (e) {
        console.warn("Failed to import config:", e);
        alert("Could not import JSON config.");
      } finally {
        importInput.value = "";
      }
    });

    // Reset
    resetBtn.addEventListener("click", () => {
      safeApplyConfig(DEFAULT_CFG);
    });

    buildUI();
  })();
  </script>
</body>
</html>

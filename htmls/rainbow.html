<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cursor Cat + Rainbow Trail (Transparent)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { height: 100vh; margin: 0; font-family: system-ui, sans-serif; }

    /* Canvas never blocks clicks and stays behind the cat */
    #trail {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2147483646; /* behind cat */
    }

    /* Cat is above trail */
    #cursor-cat {
      color: #111;
      position: relative;
      z-index: 2147483647;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <div id="cursor-cat"></div>

  <script>
  (() => {
    const mount = document.getElementById("cursor-cat");
    const canvas = document.getElementById("trail");
    if (!mount || !canvas) return;

    /* ========= CONFIG ========= */
    const CFG = {
      size: 128,
      followStrength: 0.12,
      damping: 0.84,
      maxSpeed: 10,
      rotateFollow: 0.18,
      bankAmount: 20,
      angleOffset: 0,       // try 90 / -90 / 180 if facing wrong

      // Trail
      trailWidth: 64,       // px
      fadeStrength: 0.12,   // 0..1 (higher = fades faster)
      spacing: 1.5,         // px steps
      alpha: 0.9
    };

    /* ========= CANVAS SETUP ========= */
    const ctx = canvas.getContext("2d", { alpha: true });
    let dpr = Math.max(1, window.devicePixelRatio || 1);

    function resize() {
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }
    window.addEventListener("resize", resize, { passive: true });
    resize();

    /* ========= DOM: CAT ========= */
    const wrap = document.createElement("div");
    wrap.style.position = "fixed";
    wrap.style.left = "0";
    wrap.style.top = "0";
    wrap.style.pointerEvents = "none";
    wrap.style.zIndex = "2147483647";
    wrap.innerHTML = `
      <?xml version="1.0" ?><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
<svg width="800px" height="800px" viewBox="0 0 24 24" data-name="Layer 1" id="Layer_1" xmlns="http://www.w3.org/2000/svg"><title/><rect height="15" style="fill:#738394" width="1.5" x="15" y="6"/><path d="M12,17H6V6A2.99994,2.99994,0,0,1,9,3H9a2.99994,2.99994,0,0,1,3,3Z" style="fill:#4b5661"/><path d="M10.285,21H2l2.8-2.0003L4,11.0005V10A2.99994,2.99994,0,0,1,7,7h4a2.99994,2.99994,0,0,1,3,3v1.0005l-.7298,7.298A3.00009,3.00009,0,0,1,10.285,21Z" style="fill:#4b5661"/><path d="M9,8H9A1.5,1.5,0,0,1,7.5,6.5V6h3v.5A1.5,1.5,0,0,1,9,8Z" style="fill:#fff"/><path d="M15,6V3a9.0783,9.0783,0,0,1,7,3Z" style="fill:#b3c1c9"/><path d="M16.1493,12.2127,13,13V10h2.8769A1.12307,1.12307,0,0,1,17,11.1231h0A1.12307,1.12307,0,0,1,16.1493,12.2127Z" style="fill:#4b5661"/></svg>
    `;
    mount.appendChild(wrap);

    const svg = wrap.querySelector("svg");
    svg.setAttribute("width", CFG.size);
    svg.setAttribute("height", CFG.size);
    svg.style.position = "absolute";
    svg.style.transformOrigin = "50% 50%";
    svg.style.willChange = "transform";

    /* ========= STATE ========= */
    let targetX = innerWidth / 2, targetY = innerHeight / 2;
    let x = targetX, y = targetY;
    let vx = 0, vy = 0;
    let angle = 0, lastAngle = 0, angleVel = 0;

    // Trail
    let lastTrailX = x, lastTrailY = y;
    let hue = 0;

    /* ========= INPUT ========= */
    const onMove = (e) => { targetX = e.clientX; targetY = e.clientY; };
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("pointermove", onMove, { passive: true });

    /* ========= UTILS ========= */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerpAngle = (a, b, t) => {
      let d = ((b - a + 540) % 360) - 180;
      return a + d * t;
    };

    /* ========= TRAIL DRAW ========= */
    function fadeTrail() {
      // This *erases alpha* instead of painting black.
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = `rgba(0,0,0,${CFG.fadeStrength})`;
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.restore();
    }

    function drawTrail(ax, ay, bx, by, speed) {
      const dist = Math.hypot(bx - ax, by - ay);
      if (dist < 0.01) return;

      const steps = Math.max(1, Math.floor(dist / CFG.spacing));
      let px = ax, py = ay;

      ctx.globalCompositeOperation = "source-over";
      ctx.lineWidth = CFG.trailWidth;

      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const nx = ax + (bx - ax) * t;
        const ny = ay + (by - ay) * t;

        hue = (hue + 2 + speed * 0.25) % 360;
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${CFG.alpha})`;

        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        px = nx; py = ny;
      }
    }

    /* ========= LOOP ========= */
    function tick() {
      fadeTrail();

      const dx = targetX - x;
      const dy = targetY - y;

      vx += dx * CFG.followStrength;
      vy += dy * CFG.followStrength;

      vx *= CFG.damping;
      vy *= CFG.damping;

      const speed = Math.hypot(vx, vy);
      if (speed > CFG.maxSpeed) {
        const s = CFG.maxSpeed / speed;
        vx *= s; vy *= s;
      }

      x += vx; y += vy;

      if (speed > 0.3) {
        const desired = Math.atan2(vy, vx) * 180 / Math.PI;
        angle = lerpAngle(angle, desired, CFG.rotateFollow);
      }

      const turn = (((angle - lastAngle + 540) % 360) - 180);
      lastAngle = angle;
      angleVel = angleVel * 0.85 + turn * 0.6;
      const bank = clamp(-angleVel * 0.9, -CFG.bankAmount, CFG.bankAmount);

      drawTrail(lastTrailX, lastTrailY, x, y, speed);
      lastTrailX = x; lastTrailY = y;

      const facingLeft = vx < 0;
const flipY = facingLeft ? -1 : 1;

const half = CFG.size / 2;
svg.style.transform =
  `translate(${x - half}px, ${y - half}px)
   scale(1, ${flipY})
   rotate(${angle + bank + CFG.angleOffset}deg)`;

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // tiny API
    window.CursorCat = {
      setColor: (c) => mount.style.color = c,
      setSize: (s) => { CFG.size = s; svg.setAttribute("width", s); svg.setAttribute("height", s); },
      setTrailWidth: (w) => { CFG.trailWidth = w; },
      setFade: (f) => { CFG.fadeStrength = f; }
    };
  })();
  </script>
</body>
</html>
